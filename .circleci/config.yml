version: 2.1

defaults: &defaults
  resource_class: small
  docker:
    - image: gcr.io/snyk-main/nsolid-cicd:dubnium-3.6.0
      auth:
        username: _json_key
        password: $GCLOUD_GCR_BUILDER
  working_directory: ~/go-semver

private_cicd_repo_auth: &private_cicd_repo_auth
  auth:
    username: _json_key
    password: $GCLOUD_GCR_BUILDER

commands:
  install_deps:
    description: Install dependencies
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-go-semver-npm-cache-{{ checksum "package-lock.json" }}
            - v1-go-semver-npm-cache-
      - run:
          name: Use snyk-main npmjs user
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-go-semver-npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules/

jobs:
  install_dev:
    <<: *defaults
    environment:
      NODE_ENV: development
    steps:
      - install_deps
  install_prod:
    <<: *defaults
    steps:
      - install_deps
  lint:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/go-semver
      - run:
          name: Run lint
          command: npm run lint
  test:
    <<: *defaults
    docker:
    - image: gcr.io/snyk-main/nsolid-cicd:dubnium-3.6.0
      auth:
        username: _json_key
        password: $GCLOUD_GCR_BUILDER
    steps:
      - checkout
      - attach_workspace:
          at: ~/go-semver
      - run:
          name: Run tests
          command: npm test
  release:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Release on GitHub
          command: npx semantic-release

workflows:
  version: 2
  test_and_release:
    jobs:
      - install_dev:
          name: Install DEV
          context: nodejs-install
          filters:
            branches:
              ignore:
                - master
      - lint:
          name: Lint
          context: nodejs-install
          requires:
            - Install DEV
          filters:
            branches:
              ignore:
                - master
      - test:
          name: Test
          context: nodejs-install
          requires:
            - Install DEV
          filters:
            branches:
              ignore:
                - master
      - install_prod:
          name: Install PROD
          context: nodejs-install
          requires:
            - Test
            - Lint
          filters:
            branches:
              ignore:
                - master
      - release:
          name: Release to GitHub
          context: nodejs-app-release
          requires:
            - Install PROD
          filters:
            branches:
              only:
                - master
