version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

defaults: &defaults
  resource_class: small
  docker:
    - image: cimg/node:24.16

commands:
  install_deps:
    description: Install dependencies
    steps:
      - run:
          name: Install dependencies
          command: npm install

jobs:
  security-scans:
    <<: *defaults
    steps:
      - checkout
      - install_deps
      - prodsec/security_scans:
          mode: auto
          open-source-additional-arguments: --exclude=test
          iac-scan: disabled
  test:
    <<: *defaults
    steps:
      - checkout
      - install_deps
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm test
  release:
    <<: *defaults
    steps:
      - checkout
      - install_deps
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25.0.3

workflows:
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
          filters:
            branches:
              ignore:
                - main

      - security-scans:
          name: Security Scans
          context:
            - open_source-managed
            - nodejs-install

      - test:
          name: Test

      - release:
          name: Release
          context:
            - nodejs-install
            - github-release
          requires:
            - Test
          filters:
            branches:
              only:
                - main
